<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — StarryTales</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0c1526">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we'll send you a link to reset it.</p>
    <form id="forgotForm">
      <label for="email">Email address</label>
      <input type="email" id="email" required>
      <button type="submit">Send reset link</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="foot-link"><a href="login.html">Back to log in</a></p>
  </div>

<script>
  const API_BASE = window.location.origin;

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.className = 'msg';

    const parentEmail = document.getElementById('email').value.trim();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parentEmail }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || 'Could not process your request.';
        msg.classList.add('show', 'error');
        submitBtn.disabled = false;
        return;
      }

      msg.textContent = "If an account exists for that email, we've sent a reset link.";
      msg.classList.add('show', 'success');
    } catch (err) {
      msg.textContent = 'Network error — please try again.';
      msg.classList.add('show', 'error');
      submitBtn.disabled = false;
    }
  });
</script>
<script src="/pwa.js"></script>
</body>
</html>
