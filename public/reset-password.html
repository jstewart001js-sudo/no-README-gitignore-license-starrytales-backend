<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — StarryTales</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0c1526">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="sub">Enter a new password for your StarryTales account.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="At least 8 characters" required minlength="8">
      <button type="submit">Reset password</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="foot-link"><a href="login.html">Back to log in</a></p>
  </div>

<script>
  const API_BASE = window.location.origin;
  const token = new URLSearchParams(window.location.search).get('token');
  const form = document.getElementById('resetForm');
  const msg = document.getElementById('msg');

  if (!token) {
    form.hidden = true;
    msg.textContent = 'This reset link is missing its token. Please request a new one from the forgot password page.';
    msg.classList.add('show', 'error');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      msg.textContent = 'Passwords do not match.';
      msg.classList.add('show', 'error');
      return;
    }

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || 'Could not reset your password.';
        msg.classList.add('show', 'error');
        submitBtn.disabled = false;
        return;
      }

      msg.textContent = 'Password reset! Redirecting you to log in...';
      msg.classList.add('show', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    } catch (err) {
      msg.textContent = 'Network error — please try again.';
      msg.classList.add('show', 'error');
      submitBtn.disabled = false;
    }
  });
</script>
<script src="/pwa.js"></script>
</body>
</html>
